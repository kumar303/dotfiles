[theme]
name = "one-light"

[theme.custom]
accent = "#4876d6"
panel_bg = "#fbfbfb"
sidebar_bg = "#f6f6f6"
active_row_bg = "#f0f0f0"
selection_bg = "#d3e8f8"
surface0 = "#f0f0f0"
surface1 = "#e0e0e0"
surface_dim = "#d9d9d9"
overlay0 = "#403f53"
overlay1 = "#403f53"
text = "#403f53"
subtext0 = "#403f53"
mauve = "#994cc3"
green = "#0c696e"
yellow = "#8a6d00"
red = "#bc5454"
blue = "#4876d6"
teal = "#0c969b"
peach = "#c96765"

[keys]
close_tab = "cmd+shift+k"
next_tab = "ctrl+cmd+backtick"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[[keys.command]]
key = "ctrl+backtick"
type = "plugin_action"
command = "kumar303.split-vim-above.toggle"

[[keys.command]]
key = "cmd+alt+backtick"
type = "shell"
command = "herdr tab create --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" --cwd \"$HERDR_ACTIVE_PANE_CWD\" --focus"
